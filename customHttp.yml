customHeaders:
  - pattern: /assets/*
    headers:
      - key: Cache-Control
        value: public,max-age=31536000,immutable
  - pattern: /fonts/*
    headers:
      - key: Cache-Control
        value: public,max-age=31536000,immutable
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: public,max-age=0,must-revalidate
